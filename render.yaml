services:
  - type: web
    name: digitalsentinel
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    disk:
      name: digitalsentinel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/digitalsentinel.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SEED_DEMO_DATA
        value: "false"
