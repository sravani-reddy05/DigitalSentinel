<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | DigitalSentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('project_static', filename='static/style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-brand-icon"><i class="bi bi-shield-check"></i></div>
        <h2>DigitalSentinel</h2>
        <p class="text-muted">Sign in to your security workspace</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control mb-3" id="email" name="email"
                   type="email" autocomplete="username" required>

            <label class="form-label" for="password">Password</label>
            <input class="form-control mb-3" id="password" name="password"
                   type="password" autocomplete="current-password" required>

            <button class="btn btn-primary w-100" type="submit">
                Sign In <i class="bi bi-arrow-right"></i>
            </button>
        </form>
        <p class="login-note">Demo interface · Authentication must be configured.</p>
    </div>
</body>
</html>
